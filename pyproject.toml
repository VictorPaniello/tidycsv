[project]
name = "tidycsv"
version = "0.1.0"
description = "Config-driven CLI that normalizes messy CSV/Excel exports into a clean, validated schema, with a report of what was fixed and what was flagged."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Paniello" }]
dependencies = [
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
]

[project.scripts]
tidycsv = "tidycsv.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidycsv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() calls-as-defaults are the documented,
# idiomatic Typer pattern - not a real "mutable default" bug.
"src/tidycsv/cli.py" = ["B008"]
